<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Elaina's Piano</title>
<style>
  html, body {
    margin: 0;
    height: 100dvh;
    background: radial-gradient(circle at 50% 0%, #3b1a6e, #140a2e 70%);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #keys {
    display: flex;
    gap: 8px;
    box-sizing: border-box;
    height: 100dvh;
    width: 100%;
    padding: 10px 10px 18px;
  }
  .key {
    flex: 1;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: none;
    border-radius: 22px;
    /* glossy highlight over the key's own colour */
    background:
      linear-gradient(160deg, rgba(255,255,255,.45), rgba(255,255,255,0) 45%),
      var(--c);
    box-shadow:
      0 9px 0 rgba(0,0,0,.4),
      inset 0 -12px 24px rgba(0,0,0,.18),
      inset 0 2px 0 rgba(255,255,255,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .06s, box-shadow .06s, filter .06s;
  }
  .face {
    font-size: min(7.5vw, 22vh);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.3));
    pointer-events: none;
  }
  .key.pressed {
    transform: translateY(7px);
    filter: brightness(1.25) saturate(1.2);
    box-shadow:
      0 2px 0 rgba(0,0,0,.4),
      0 0 45px var(--c),
      inset 0 -12px 24px rgba(0,0,0,.18);
  }
  .key.pressed .face { animation: pop .4s ease-out; }
  @keyframes pop {
    0%   { transform: scale(1) rotate(0); }
    35%  { transform: scale(1.45) rotate(-12deg); }
    70%  { transform: scale(.95) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .fx {
    position: fixed;
    font-size: 30px;
    margin: -18px 0 0 -18px;
    pointer-events: none;
    z-index: 2;
    animation: fly .9s ease-out forwards;
  }
  @keyframes fly {
    0%   { transform: translate(0, 0) scale(.4) rotate(0); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--rot)); opacity: 0; }
  }
  body.locked::after {
    content: '🔒';
    position: fixed;
    top: 4px;
    right: 8px;
    font-size: 14px;
    opacity: .55;
    pointer-events: none;
    z-index: 3;
  }
  @media (orientation: portrait) {
    #keys { flex-direction: column; padding: 10px 10px 16px; }
    .face { font-size: min(16vw, 8vh); }
  }
  @media (prefers-reduced-motion: reduce) {
    .fx { display: none; }
    .key.pressed .face { animation: none; }
  }
</style>
</head>
<body>
<main id="keys"></main>
<script src="piano.js"></script>
</body>
</html>
