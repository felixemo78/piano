<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Elaina's Piano</title>
<style>
  html, body {
    margin: 0;
    height: 100dvh;
    background: #222;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #keys {
    display: flex;
    height: 100dvh;
    width: 100%;
  }
  .key {
    flex: 1;
    border: none;
    margin: 2px;
    border-radius: 16px;
    font-size: min(12vw, 12vh);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.05s, filter 0.05s;
  }
  .key.pressed {
    transform: scale(0.95);
    filter: brightness(1.3);
  }
  @media (orientation: portrait) {
    #keys { flex-direction: column; }
    .key { font-size: min(10vw, 8vh); }
  }
</style>
</head>
<body>
<main id="keys"></main>
<script src="piano.js"></script>
</body>
</html>
